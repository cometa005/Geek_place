<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeekPlace | Nerdcore BR</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060608;
  --s1: #0e0e14;
  --s2: #14141d;
  --s3: #1c1c28;
  --border: #22223a;
  --accent: #8b5cf6;
  --accent2: #6d28d9;
  --glow: rgba(139,92,246,0.3);
  --muted: #4a4a6a;
  --text: #ddddf0;
  --white: #ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

.layout{display:flex;height:100%;width:100%;overflow:hidden}

/* SIDEBAR */
#sidebar{width:230px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.logo{padding:26px 22px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.logo-svg{width:26px;height:26px;color:var(--accent)}
.logo-text{font-family:'Anton',sans-serif;font-size:1.45rem;letter-spacing:2px;color:#fff;text-transform:uppercase}
.logo-text span{color:var(--accent)}
.nav-section{font-size:.6rem;font-weight:700;letter-spacing:3px;color:var(--muted);text-transform:uppercase;padding:0 18px 6px;margin-top:18px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 18px;margin:2px 6px;border-radius:8px;cursor:pointer;border:none;background:none;color:var(--muted);font-weight:600;font-size:.875rem;text-align:left;width:calc(100% - 12px);transition:all .15s;font-family:'Space Grotesk',sans-serif}
.nav-btn svg{width:17px;height:17px;flex-shrink:0}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav-btn.active{color:var(--accent);background:rgba(139,92,246,.12)}
.sidebar-now{margin-top:auto;border-top:1px solid var(--border);padding:16px}
.sidebar-now-label{font-size:.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sidebar-now-track{display:flex;align-items:center;gap:10px;cursor:pointer}
.sidebar-now-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--border);flex-shrink:0}
.sidebar-now-info{min-width:0}
.sidebar-now-title{font-size:.8rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-now-artist{font-size:.7rem;color:var(--muted);font-weight:500}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;height:calc(100% - 80px)}
#topbar{height:62px;flex-shrink:0;padding:0 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:rgba(6,6,8,.85);backdrop-filter:blur(12px)}
#search-wrap{flex:1;max-width:380px;position:relative}
#search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
#search-input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:999px;padding:9px 14px 9px 38px;color:var(--text);outline:none;transition:border-color .2s;font-family:'Space Grotesk',sans-serif;font-size:.875rem}
#search-input:focus{border-color:var(--accent)}
#search-input::placeholder{color:var(--muted)}

/* TAB PILLS */
.tab-pills{display:flex;gap:6px}
.tab-pill{padding:6px 14px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.75rem;font-weight:700;cursor:pointer;transition:all .15s;font-family:'Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:.5px}
.tab-pill:hover{color:#fff;border-color:var(--muted)}
.tab-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}

#content{flex:1;overflow-y:auto;padding:32px 28px}

/* SECTION HEADER */
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.sec-bar{width:3px;height:32px;background:var(--accent);border-radius:2px;box-shadow:0 0 12px var(--glow)}
.sec-title{font-family:'Anton',sans-serif;font-size:1.7rem;letter-spacing:1px;text-transform:uppercase;color:#fff}
.sec-count{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--s2);border:1px solid var(--border);border-radius:99px;padding:2px 9px}

/* ARTIST CARDS */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:var(--s3);box-shadow:0 10px 36px rgba(0,0,0,.5)}
.card-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:12px;background:var(--s3)}
.card-name{font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.card-sub{font-size:.7rem;color:var(--muted);font-weight:500}
.card-overlay{position:absolute;inset:0;background:rgba(139,92,246,.18);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;border-radius:12px}
.card:hover .card-overlay{opacity:1}
.play-circle{width:44px;height:44px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px var(--glow)}

/* TRACK LIST */
.track-list{display:flex;flex-direction:column;gap:2px}
.track-item{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:8px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.track-item:hover{background:var(--s2)}
.track-item.active{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.2)}
.track-num{width:22px;text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);flex-shrink:0}
.track-thumb{width:44px;height:36px;border-radius:5px;object-fit:cover;background:var(--border);flex-shrink:0}
.track-title{font-size:.85rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-sub{font-size:.7rem;color:var(--muted);font-weight:500;margin-top:2px}
.track-dur{font-size:.7rem;font-weight:700;color:var(--muted);flex-shrink:0;tabular-nums}
.track-eq{width:22px;height:22px;flex-shrink:0;display:none}
.track-item.active .track-num{display:none}
.track-item.active .track-eq{display:flex;align-items:flex-end;gap:2px}
.eq-bar{width:3px;background:var(--accent);border-radius:1px;animation:eq .5s ease-in-out infinite alternate}
.eq-bar:nth-child(2){animation-delay:.15s;height:10px}
.eq-bar:nth-child(3){animation-delay:.3s;height:6px}
@keyframes eq{from{height:4px}to{height:14px}}

/* PLAYER BAR */
#player-bar{height:80px;position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,16,.95);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:16px;z-index:40;backdrop-filter:blur(20px)}
#player-bar.idle{opacity:.35;pointer-events:none}
.p-info{display:flex;align-items:center;gap:12px;width:260px;flex-shrink:0;cursor:pointer}
#p-thumb{width:48px;height:38px;border-radius:6px;object-fit:cover;background:var(--border)}
.p-title{font-weight:700;font-size:.82rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-artist{font-size:.7rem;color:var(--muted);font-weight:500}
.p-expand-hint{font-size:.65rem;color:var(--accent);font-weight:700;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0}

.prog-wrap{flex:1;height:3px;background:var(--border);border-radius:99px;cursor:pointer;position:relative}
.prog-wrap:hover{height:5px;transition:height .1s}
.prog-fill{height:100%;background:var(--accent);border-radius:99px;width:0%;transition:width .4s linear}
.prog-wrap:hover .prog-fill{background:var(--white)}

/* CONTROLS */
.ctrl-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.ctrl-btns{display:flex;align-items:center;gap:16px}
.btn-ctrl{background:none;border:none;cursor:pointer;color:var(--muted);transition:color .15s;display:flex;align-items:center;justify-content:center}
.btn-ctrl:hover{color:#fff}
.btn-ctrl svg{width:18px;height:18px}
.btn-play{width:36px;height:36px;background:#fff;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s;flex-shrink:0}
.btn-play:hover{transform:scale(1.08)}
.btn-play svg{width:16px;height:16px;fill:#000;color:#000}
.time-row{width:100%;max-width:500px;display:flex;align-items:center;gap:10px}
.time-label{font-size:.67rem;font-weight:700;color:var(--muted);tabular-nums;white-space:nowrap}

.vol-group{width:180px;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.vol-group svg{width:16px;height:16px}
input[type=range]{accent-color:var(--accent);height:3px;cursor:pointer}
.btn-video{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);color:var(--accent);font-size:.65rem;font-weight:700;padding:4px 8px;border-radius:4px;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:'Space Grotesk',sans-serif}
.btn-video:hover{background:rgba(139,92,246,.25)}

/* EXPANDED PLAYER */
#expanded{position:fixed;inset:0;background:#07070c;z-index:60;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
#expanded.open{transform:translateY(0)}
.exp-topbar{height:58px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05)}
.btn-back{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;transition:color .15s;font-family:'Space Grotesk',sans-serif}
.btn-back:hover{color:#fff}
.btn-back svg{width:16px;height:16px}
.exp-badge{font-size:.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.exp-body{flex:1;display:grid;grid-template-columns:1fr 1fr;max-width:1100px;width:100%;margin:0 auto;padding:32px 28px;gap:48px;overflow:hidden}

.exp-left{display:flex;flex-direction:column;align-items:center;gap:24px}
#exp-thumb{width:100%;max-width:320px;aspect-ratio:1;object-fit:cover;border-radius:18px;box-shadow:0 30px 80px rgba(139,92,246,.3);border:1px solid rgba(139,92,246,.15)}
.exp-info{text-align:center;width:100%}
#exp-title{font-family:'Anton',sans-serif;font-size:1.6rem;letter-spacing:.5px;text-transform:uppercase;color:#fff;line-clamp:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#exp-artist{color:var(--accent);font-weight:600;font-size:.95rem;margin-top:4px}
.exp-prog{width:100%;display:flex;align-items:center;gap:10px}
.exp-prog .prog-wrap{height:4px}
.exp-prog .prog-wrap:hover{height:6px}
.exp-ctrl{display:flex;align-items:center;justify-content:center;gap:20px}
.exp-btn-play{width:56px;height:56px;background:#fff;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.exp-btn-play:hover{transform:scale(1.06)}
.exp-btn-play svg{width:22px;height:22px;fill:#000;color:#000}
.exp-btn-ctrl{background:none;border:none;cursor:pointer;color:var(--muted);transition:color .15s;display:flex}
.exp-btn-ctrl:hover{color:#fff}
.exp-btn-ctrl svg{width:22px;height:22px}

/* VIDEO MODAL INSIDE EXPANDED */
.exp-video-row{display:flex;align-items:center;gap:10px;width:100%}
.btn-toggle-video{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--s2);color:var(--muted);font-size:.72rem;font-weight:700;cursor:pointer;transition:all .15s;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;gap:6px}
.btn-toggle-video:hover{border-color:var(--accent);color:var(--accent)}
.btn-toggle-video.active{background:rgba(139,92,246,.15);border-color:var(--accent);color:var(--accent)}
.btn-toggle-video svg{width:13px;height:13px}
#exp-video-wrap{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--border);display:none;background:#000}
#exp-video-wrap.show{display:block}
#exp-video-wrap iframe{width:100%;height:100%;border:none}

/* LYRICS */
.exp-right{display:flex;flex-direction:column;overflow:hidden}
.lyrics-header{display:flex;align-items:center;gap:8px;font-size:.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.lyrics-header svg{width:14px;height:14px}
#lyric-box{flex:1;overflow-y:auto;padding-right:8px;display:flex;flex-direction:column;gap:0}
.lyric-para{margin-bottom:20px}
.lyric-line{font-size:1.3rem;font-weight:700;line-height:1.75;color:rgba(255,255,255,.2);cursor:default;padding:1px 0;transition:all .15s;border-radius:4px}
.lyric-line:hover{color:#fff;text-shadow:0 0 20px rgba(139,92,246,.6)}
.lyric-line.hl{color:#fff;text-shadow:0 0 18px rgba(139,92,246,.5)}

/* ARTIST DETAIL HEADER */
.art-header{display:flex;align-items:flex-end;gap:20px;padding:24px;background:linear-gradient(to bottom,rgba(139,92,246,.08),transparent);border:1px solid var(--border);border-radius:16px;margin-bottom:24px}
.art-header img{width:90px;height:90px;border-radius:10px;object-fit:cover;border:1px solid rgba(139,92,246,.3);box-shadow:0 8px 30px rgba(139,92,246,.2)}
.art-header-info{}
.art-header-badge{font-size:.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.art-header-name{font-family:'Anton',sans-serif;font-size:2rem;letter-spacing:1px;text-transform:uppercase;color:#fff}
.art-header-meta{font-size:.75rem;color:var(--muted);font-weight:500;margin-top:4px}

/* HIDDEN IFRAME */
#yt-audio-wrap{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none}

.fade-in{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

.empty-state{padding:48px;text-align:center;border:2px dashed var(--border);border-radius:16px;color:var(--muted);font-weight:600;font-size:.875rem}

@media(max-width:768px){
  #sidebar{width:64px}
  .nav-btn span,.logo-text,.nav-section,.sidebar-now-info,.sidebar-now-label{display:none}
  .nav-btn{justify-content:center}
  .p-info{width:120px}
  .p-expand-hint,.vol-group,.btn-video{display:none}
  .exp-body{grid-template-columns:1fr;overflow-y:auto;padding:20px 16px;gap:28px}
  .exp-right{min-height:250px}
}
</style>
</head>
<body>

<div class="layout">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="logo" onclick="goHome()">
      <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      <span class="logo-text"><span>Geek</span>Place</span>
    </div>
    <div class="nav-section">Menu</div>
    <button class="nav-btn active" data-s="artistas" onclick="navTo('artistas',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/></svg>
      <span>Artistas</span>
    </button>
    <button class="nav-btn" data-s="top" onclick="navTo('top',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      <span>Top Hits</span>
    </button>
    <button class="nav-btn" data-s="recentes" onclick="navTo('recentes',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Recentes</span>
    </button>

    <div class="sidebar-now" id="sidebar-now" style="display:none">
      <div class="sidebar-now-label">Tocando</div>
      <div class="sidebar-now-track" onclick="openExpanded()">
        <img class="sidebar-now-thumb" id="sb-thumb" src="" alt="">
        <div class="sidebar-now-info">
          <div class="sidebar-now-title" id="sb-title"></div>
          <div class="sidebar-now-artist" id="sb-artist"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <div id="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="Buscar músicas ou artistas..." oninput="handleSearch(this.value)">
      </div>
      <div class="tab-pills">
        <button class="tab-pill active" onclick="navTo('artistas',null,this)">Artistas</button>
        <button class="tab-pill" onclick="navTo('top',null,this)">Top</button>
        <button class="tab-pill" onclick="navTo('recentes',null,this)">Recentes</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- PLAYER BAR -->
<div id="player-bar" class="idle">
  <div class="p-info" onclick="openExpanded()">
    <img id="p-thumb" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
    <div style="min-width:0;flex:1">
      <div class="p-title" id="p-title">Nenhuma faixa</div>
      <div class="p-artist" id="p-artist">—</div>
    </div>
    <span class="p-expand-hint">▲ Expandir</span>
  </div>

  <div class="ctrl-group">
    <div class="ctrl-btns">
      <button class="btn-ctrl" onclick="prevTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16zM5 4h2v16H5z"/></svg>
      </button>
      <button class="btn-play" onclick="togglePlay()">
        <svg id="p-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn-ctrl" onclick="nextTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4zM19 4h2v16h-2z"/></svg>
      </button>
    </div>
    <div class="time-row">
      <span class="time-label" id="p-cur">0:00</span>
      <div class="prog-wrap" onclick="seekBar(event,this)">
        <div class="prog-fill" id="p-fill"></div>
      </div>
      <span class="time-label" id="p-dur">0:00</span>
    </div>
  </div>

  <div class="vol-group">
    <button class="btn-ctrl" onclick="toggleMute()" style="color:var(--muted)">
      <svg id="p-vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </button>
    <input type="range" min="0" max="100" value="100" oninput="setVol(this.value)" style="width:70px">
    <button class="btn-video" onclick="toggleVideoBar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;display:inline;vertical-align:middle;margin-right:3px"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M17 2l5 5-5 5"/><path d="M22 7H7"/></svg>
      Ver Vídeo
    </button>
  </div>
</div>

<!-- EXPANDED PLAYER (MODO IMERSIVO) -->
<div id="expanded">
  <div class="exp-topbar">
    <button class="btn-back" onclick="closeExpanded()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      Voltar
    </button>
    <span class="exp-badge">◈ GeekPlace · Modo Imersivo</span>
    <div style="width:70px"></div>
  </div>

  <div class="exp-body">
    <!-- LEFT -->
    <div class="exp-left">
      <img id="exp-thumb" src="" alt="">
      <div class="exp-info">
        <div id="exp-title">—</div>
        <div id="exp-artist">—</div>
      </div>

      <!-- VIDEO TOGGLE -->

// ─── BUILD TOP LIST ───────────────────────────────────────────────────────────
db.top = [];
db.artistas.forEach(a => {
  a.tracks.forEach(t => {
    db.top.push({...t, artist: a.name, context: a.name});
  });
});

// ─── STATE ───────────────────────────────────────────────────────────────────
let queue=[], qIdx=-1, playing=false, muted=false;
let progTimer=null, trackStart=0, elapsed=0, trackDur=180;
let recents=[], currentSec='artistas';
let videoExpanded=false;

// ─── AUDIO ENGINE ─────────────────────────────────────────────────────────────
function buildAudioUrl(ytId, startAt=0) {
  let u = `https://www.youtube.com/embed/${ytId}?autoplay=1&controls=0&rel=0&showinfo=0&iv_load_policy=3&mute=${muted?1:0}`;
  if(startAt>0) u += `&start=${Math.floor(startAt)}`;
  return u;
}

function buildVideoUrl(ytId, startAt=0) {
  let u = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&mute=${muted?1:0}`;
  if(startAt>0) u += `&start=${Math.floor(startAt)}`;
  return u;
}

function loadTrack(q, i, startAt=0) {
  queue=q; qIdx=i;
  const t=queue[qIdx];
  if(!t) return;
  elapsed=startAt;
  trackDur=t.dur||200;

  // Load audio iframe
  document.getElementById('yt-audio').src=buildAudioUrl(t.yt, startAt);

  // If video is showing in expanded, update it too
  if(videoExpanded) {
    document.getElementById('exp-video-iframe').src=buildVideoUrl(t.yt, startAt);
  }

  updateUI(t);
  playing=true;
  updatePlayIcons(true);
  if(startAt===0) addRecent(t);
  startTimer();
  refreshHL();
}

function updateUI(t) {
  const name = t.artist||t.context||'Artista';
  // Mini player
  document.getElementById('p-thumb').src=t.thumb;
  document.getElementById('p-title').textContent=t.title;
  document.getElementById('p-artist').textContent=name;
  document.getElementById('player-bar').classList.remove('idle');
  // Sidebar
  document.getElementById('sb-thumb').src=t.thumb;
  document.getElementById('sb-title').textContent=t.title;
  document.getElementById('sb-artist').textContent=name;
  document.getElementById('sidebar-now').style.display='block';
  // Expanded
  document.getElementById('exp-thumb').src=t.thumb;
  document.getElementById('exp-title').textContent=t.title;
  document.getElementById('exp-artist').textContent=name;
  // Lyrics
  const lb=document.getElementById('lyric-box');
  const raw=t.lyrics||'Letra não disponível.';
  lb.innerHTML=raw.split('\n\n').map(p=>
    `<div class="lyric-para">${p.split('\n').map(l=>
      `<div class="lyric-line">${l||'&nbsp;'}</div>`).join('')}</div>`
  ).join('');
}

function updatePlayIcons(isPlay) {
  playing=isPlay;
  // Mini
  const pi=document.getElementById('p-play-icon');
  pi.innerHTML=isPlay?'<path d="M6 19h4V5H6zm8-14v14h4V5z"/>':'<path d="M8 5v14l11-7z"/>';
  // Expanded
  const ei=document.getElementById('exp-play-icon');
  ei.innerHTML=isPlay?'<path d="M6 19h4V5H6zm8-14v14h4V5z"/>':'<path d="M8 5v14l11-7z"/>';
}

function togglePlay() {
  if(qIdx<0) return;
  if(playing) {
    elapsed+=(Date.now()-trackStart)/1000;
    document.getElementById('yt-audio').src='about:blank';
    if(videoExpanded) document.getElementById('exp-video-iframe').src='about:blank';
    playing=false;
    updatePlayIcons(false);
    stopTimer();
  } else {
    loadTrack(queue,qIdx,elapsed);
  }
}

function nextTrack() { if(queue.length) loadTrack(queue,(qIdx+1)%queue.length); }
function prevTrack() { if(queue.length) loadTrack(queue,(qIdx-1+queue.length)%queue.length); }

function toggleMute() {
  muted=!muted;
  const icon=document.getElementById('p-vol-icon');
  if(muted) {
    icon.innerHTML='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
  } else {
    icon.innerHTML='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
  }
  if(qIdx<0) return;
  const cur=(Date.now()-trackStart)/1000+elapsed;
  document.getElementById('yt-audio').src=buildAudioUrl(queue[qIdx].yt, cur);
}

function setVol(v) {}

function seekBar(e, el) {
  if(qIdx<0) return;
  const pct=e.offsetX/el.offsetWidth;
  loadTrack(queue,qIdx,pct*trackDur);
}

// VIDEO CONTROLS
function toggleVideoBar() { openExpanded(); toggleVideoExp(); }

function toggleVideoExp() {
  videoExpanded=!videoExpanded;
  const btn=document.getElementById('btn-toggle-video');
  const wrap=document.getElementById('exp-video-wrap');
  const iframe=document.getElementById('exp-video-iframe');
  if(videoExpanded) {
    btn.classList.add('active');
    wrap.classList.add('show');
    if(qIdx>=0) {
      const cur=(Date.now()-trackStart)/1000+elapsed;
      iframe.src=buildVideoUrl(queue[qIdx].yt, cur);
    }
  } else {
    btn.classList.remove('active');
    wrap.classList.remove('show');
    iframe.src='about:blank';
  }
}

// ─── TIMER ────────────────────────────────────────────────────────────────────
function startTimer() {
  stopTimer();
  trackStart=Date.now()-(elapsed*1000);
  progTimer=setInterval(()=>{
    const e=(Date.now()-trackStart)/1000;
    const pct=Math.min((e/trackDur)*100,100);
    ['p-fill','exp-fill'].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.width=pct+'%'; });
    ['p-cur','exp-cur'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=fmt(e); });
    ['p-dur','exp-dur'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=fmt(trackDur); });
    if(pct>=100){ stopTimer(); elapsed=0; nextTrack(); }
  },400);
}
function stopTimer(){ if(progTimer){clearInterval(progTimer);progTimer=null;} }
function fmt(s){ s=Math.max(0,Math.floor(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

// ─── EXPANDED PLAYER ─────────────────────────────────────────────────────────
function openExpanded() {
  if(qIdx<0) return;
  document.getElementById('expanded').classList.add('open');
}
function closeExpanded() {
  document.getElementById('expanded').classList.remove('open');
  if(videoExpanded) toggleVideoExp();
}

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function navTo(sec, navBtn, tabBtn) {
  currentSec=sec;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pill').forEach(b=>b.classList.remove('active'));
  if(navBtn) navBtn.classList.add('active');
  if(tabBtn) tabBtn.classList.add('active');
  // sync both
  const nb=document.querySelector(`.nav-btn[data-s="${sec}"]`);
  if(nb) nb.classList.add('active');
  renderSection(sec);
  document.getElementById('search-input').value='';
}
function goHome() { navTo('artistas', document.querySelector('[data-s="artistas"]')); }

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderSection(sec) {
  const c=document.getElementById('content');
  if(sec==='top') { c.innerHTML=renderTopHTML(); return; }
  if(sec==='recentes') { c.innerHTML=renderRecentHTML(); return; }
  const items=db.artistas;
  c.innerHTML=`
    <div class="sec-head fade-in">
      <div class="sec-bar"></div>
      <h2 class="sec-title">Artistas BR</h2>
      <span class="sec-count">${items.length}</span>
    </div>
    <div class="cards-grid fade-in">
      ${items.map(a=>`
        <div class="card" onclick="renderDetail('${a.id}')">
          <img class="card-img" src="${a.img}" alt="${a.name}" loading="lazy">
          <div class="card-name">${a.name}</div>
          <div class="card-sub">${a.tags.slice(0,2).join(' · ')}</div>
          <div class="card-overlay">
            <div class="play-circle">
              <svg viewBox="0 0 24 24" fill="white" width="20" height="20"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
        </div>
      `).join('')}
    </div>`;
}

function renderDetail(id) {
  const art=db.artistas.find(a=>a.id===id);
  if(!art) return;
  const tracks=art.tracks.map(t=>({...t,artist:art.name,context:art.name}));
  const c=document.getElementById('content');
  c.innerHTML=`
    <button onclick="renderSection('artistas')" style="display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:99px;cursor:pointer;font-size:.75rem;font-weight:700;font-family:'Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:.5px;margin-bottom:24px;transition:color .15s" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--muted)'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar
    </button>
    <div class="art-header fade-in">
      <img src="${art.img}" alt="${art.name}">
      <div class="art-header-info">
        <div class="art-header-badge">Artista Oficial</div>
        <div class="art-header-name">${art.name}</div>
        <div class="art-header-meta">${tracks.length} música${tracks.length!==1?'s':''} · ${art.tags.join(' · ')}</div>
      </div>
    </div>
    <button onclick='loadTrack(${JSON.stringify(tracks)},0)' style="background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:99px;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;margin-bottom:20px;font-family:'Space Grotesk',sans-serif;transition:background .15s" onmouseover="this.style.background='var(--accent2)'" onmouseout="this.style.background='var(--accent)'">▶ Tocar Tudo</button>
    <div class="track-list fade-in">
      ${tracks.map((t,i)=>`
        <div class="track-item" id="ti-${t.yt}" onclick='loadTrack(${JSON.stringify(tracks)},${i})'>
          <div class="track-num">${i+1}</div>
          <div class="track-eq">
            <div class="eq-bar" style="height:8px"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar" style="height:6px"></div>
          </div>
          <img class="track-thumb" src="${t.thumb}" alt="">
          <div style="flex:1;min-width:0">
            <div class="track-title">${t.title}</div>
            <div class="track-sub">${art.name}</div>
          </div>
          <span class="track-dur">${fmt(t.dur)}</span>
        </div>
      `).join('')}
    </div>`;
  refreshHL();
}

function renderTopHTML() {
  return `
    <div class="sec-head fade-in"><div class="sec-bar"></div><h2 class="sec-title">Mais Ouvidas</h2><span class="sec-count">${db.top.length}</span></div>
    <div class="track-list fade-in">
      ${db.top.map((t,i)=>`
        <div class="track-item" onclick='loadTrack(${JSON.stringify(db.top)},${i})'>
          <div class="track-num" style="${i<3?'color:var(--accent);font-size:.85rem':''}">${i+1}</div>
          <img class="track-thumb" src="${t.thumb}" alt="">
          <div style="flex:1;min-width:0">
            <div class="track-title">${t.title}</div>
            <div class="track-sub">${t.context}</div>
          </div>
          <span class="track-dur">${fmt(t.dur)}</span>
        </div>
      `).join('')}
    </div>`;
}

function renderRecentHTML() {
  if(!recents.length) return `<div class="empty-state">Nenhuma música ouvida ainda.<br>Explore os artistas e comece a ouvir!</div>`;
  return `
    <div class="sec-head fade-in"><div class="sec-bar"></div><h2 class="sec-title">Recentes</h2></div>
    <div class="track-list fade-in">
      ${recents.map((t,i)=>`
        <div class="track-item" onclick='loadTrack(${JSON.stringify(recents)},${i})'>
          <img class="track-thumb" src="${t.thumb}" alt="">
          <div style="flex:1;min-width:0">
            <div class="track-title">${t.title}</div>
            <div class="track-sub">${t.artist||t.context}</div>
          </div>
          <span class="track-dur">${fmt(t.dur)}</span>
        </div>
      `).join('')}
    </div>`;
}

function addRecent(t) {
  recents=recents.filter(r=>r.yt!==t.yt);
  recents.unshift(t);
  if(recents.length>30) recents.pop();
}

function refreshHL() {
  if(qIdx<0||!queue[qIdx]) return;
  const cur=queue[qIdx];
  document.querySelectorAll('.track-item').forEach(el=>{
    const title=el.querySelector('.track-title')?.textContent;
    el.classList.toggle('active', title===cur.title);
  });
}

// ─── SEARCH ───────────────────────────────────────────────────────────────────
function handleSearch(q) {
  q=q.trim().toLowerCase();
  if(!q) { renderSection(currentSec); return; }
  const results=[];
  db.artistas.forEach(a=>{
    a.tracks.forEach(t=>{
      if(t.title.toLowerCase().includes(q)||a.name.toLowerCase().includes(q))
        results.push({...t,artist:a.name,context:a.name});
    });
  });
  const c=document.getElementById('content');
  if(!results.length) {
    c.innerHTML=`<div class="empty-state">Nenhum resultado para "<strong>${q}</strong>"</div>`;
    return;
  }
  c.innerHTML=`
    <div class="sec-head fade-in"><div class="sec-bar"></div><h2 class="sec-title">Resultados</h2><span class="sec-count">${results.length}</span></div>
    <div class="track-list fade-in">
      ${results.map((t,i)=>`
        <div class="track-item" onclick='loadTrack(${JSON.stringify(results)},${i})'>
          <img class="track-thumb" src="${t.thumb}" alt="">
          <div style="flex:1;min-width:0">
            <div class="track-title">${t.title}</div>
            <div class="track-sub">${t.artist}</div>
          </div>
          <span class="track-dur">${fmt(t.dur)}</span>
        </div>
      `).join('')}
    </div>`;
}

// ─── KEYBOARD SHORTCUTS ───────────────────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space') { e.preventDefault(); togglePlay(); }
  if(e.code==='ArrowRight') nextTrack();
  if(e.code==='ArrowLeft') prevTrack();
  if(e.code==='Escape') closeExpanded();
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.onload=()=>renderSection('artistas');
</script>
